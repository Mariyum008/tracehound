<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracehound - AI-assisted breach investigation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.min.css">
<style>
  body { background: #0d1117; margin: 0; }
  .markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 40px 24px; }
  .bar { max-width: 980px; margin: 0 auto; padding: 16px 24px 0; }
  .bar a { color: #58a6ff; font: 14px -apple-system, sans-serif; text-decoration: none; }
</style>
</head>
<body>
<div class="bar"><a href="https://github.com/Mariyum008/tracehound">View on GitHub &rarr;</a></div>
<article id="readme" class="markdown-body">Loading...</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
  // Render README.md so the page always matches the repo
  fetch("README.md").then(r => r.text()).then(md => {
    const el = document.getElementById("readme");
    el.innerHTML = marked.parse(md);
    // Point repo file links (src/, EVALUATION.md, ...) at GitHub; keep images and anchors local
    el.querySelectorAll("a[href]").forEach(a => {
      const h = a.getAttribute("href");
      if (!/^(https?:|#|mailto:)/.test(h)) a.href = "https://github.com/Mariyum008/tracehound/blob/main/" + h;
    });
  }).catch(() => { document.getElementById("readme").textContent = "Could not load README."; });
</script>
</body>
</html>
