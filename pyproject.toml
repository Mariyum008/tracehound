[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracehound"
version = "0.1.0"
description = "AI-assisted breach investigation for packet captures: detect, timeline, explain with evidence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aimaan Khan" }]
dependencies = ["scapy>=2.5", "duckdb>=1.0", "pandas>=2.0", "mcp>=1.2", "anthropic>=0.40",
                "streamlit>=1.50", "plotly>=5.20", "networkx>=3.0", "scipy>=1.11", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tracehound = "tracehound.cli:main"
tracehound-mcp = "tracehound.server:main"

[tool.setuptools.packages.find]
where = ["src"]
